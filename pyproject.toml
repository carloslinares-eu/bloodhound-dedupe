[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodhound-dedupe"
dynamic = ["version"]
description = "Find the unique files across many folders and copy them into one place, leaving duplicates behind."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Linares" }]
keywords = ["duplicates", "deduplication", "file copy", "backup", "sha256", "tkinter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
# Bloodhound only uses the Python standard library (including Tkinter).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",       # scripts/generate_icon.py
    "pyinstaller>=6.0",   # packaging/bloodhound.spec
]

[project.gui-scripts]
bloodhound = "bloodhound.app:main"

[tool.setuptools.dynamic]
version = { attr = "bloodhound.__version__" }

[tool.setuptools.packages.find]
include = ["bloodhound*"]

[tool.setuptools.package-data]
bloodhound = ["assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
